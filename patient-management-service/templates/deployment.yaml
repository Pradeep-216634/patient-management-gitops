apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Chart.Name }}

  labels:
    app: {{ .Chart.Name }}

spec:

  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: {{ .Chart.Name }}

  template:

    metadata:
      labels:
        app: {{ .Chart.Name }}

    spec:

      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}

      containers:

        - name: {{ .Chart.Name }}

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8080

          resources:
{{ toYaml .Values.resources | indent 12 }}

          readinessProbe:

            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http

            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:

            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http

            initialDelaySeconds: 30
            periodSeconds: 10