replicaCount: 2

image:
  repository: 349865002678.dkr.ecr.ap-south-1.amazonaws.com/patient-management-service
  tag: "1.0.1"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ecr-pull-secret

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 250m
    memory: 256Mi

  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

probes:
  readiness:
    path: /actuator/health/readiness
  liveness:
    path: /actuator/health/liveness